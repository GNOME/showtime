include:
  - project: "GNOME/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"
  - component: gitlab.gnome.org/GNOME/citemplates/release-service@master
    inputs:
      dist-job-name: "flatpak"
      tarball-artifact-path: "${TARBALL_ARTIFACT_PATH}"

variables:
  FLATPAK_MODULE: "showtime"
  TARBALL_ARTIFACT_PATH: ".flatpak-builder/build/${FLATPAK_MODULE}/_flatpak_build/meson-dist/${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.xz"

workflow:
    rules:
        # Run merge request pipelines, for main or release branches, for
        # manually triggered pipelines (source "web"), and tags, but not for
        # translation updates
        - if: ($CI_PIPELINE_SOURCE == "merge_request_event" ||
               $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED ||
               $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ||
               $CI_COMMIT_BRANCH =~ /^gnome-.*$/ ||
               $CI_PIPELINE_SOURCE == "web") &&
              $CI_COMMIT_TITLE !~ /^Update.*translation$/

flatpak:
  extends: ".flatpak"
  variables:
    MANIFEST_PATH: "build-aux/flatpak/org.gnome.Showtime.Devel.json"
    RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
    APP_ID: "org.gnome.Showtime.Devel"
    BUNDLE: "org.gnome.Showtime.Devel.flatpak"

nightly:
  extends: ".publish_nightly"
  dependencies: ["flatpak"]
  needs: ["flatpak"]
